name = "inspectpro"
main = "src/worker.js"
compatibility_date = "2026-11-27"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "inspectpro-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "inspectpro-media"

[vars]
ALLOWED_ORIGINS = ""
